[workspace]
resolver = "2"
members = [
    "crates/mux-api",
    "crates/mux-kernel",
    "crates/mux-protocol",
    "crates/mux-render",
    "crates/mux-term",
]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
nix = { version = "0.27", features = ["fs", "ioctl", "process", "signal", "term", "user", "socket"] }
libc = "0.2"
bitflags = { version = "2.4", features = ["serde"] }
signal-hook = "0.3"
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"
vte = "0.11"
parking_lot = "0.12"
# Development
rstest = "0.18"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

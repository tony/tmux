[workspace]
resolver = "2"
members = [
    "crates/mux-types",
    "crates/mux-parser",
    "crates/mux-grid",
    "crates/mux-snapshot",
    "crates/mux-grapheme-arena",
    "crates/mux-pty",
    "crates/mux-proto",
    "crates/mux-time",
    "crates/mux-termlet",
    "crates/mux-orm",
    "crates/mux-test-support",
    "crates/mux-kernel",
    "crates/mux-render",
    "crates/mux-api",
    "crates/mux-config",
    "crates/mux-term",
    "crates/mux-crdt",
    "crates/mux-fdpass",
    "crates/mux-client",
    "crates/mux-server",
    "crates/mux-input",
    "crates/mux-effects",
    "tools/tfctl",
    "tools/tfrecord",
    "tools/tfbench",
    "tools/tfdecode",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/termforge/termforge"

[workspace.dependencies]
compact_str = "0.8"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
toml = "0.8"
bitvec = "1.0"
crossbeam-channel = "0.5"
tokio = { version = "1.44", features = ["rt", "sync", "macros", "time"] }
signal-hook = "0.3"
nix = { version = "0.29", default-features = false, features = ["term", "fs", "signal", "process", "ioctl"] }

mux-types = { path = "crates/mux-types" }
mux-parser = { path = "crates/mux-parser" }
mux-grid = { path = "crates/mux-grid" }
mux-snapshot = { path = "crates/mux-snapshot" }
mux-grapheme-arena = { path = "crates/mux-grapheme-arena" }
mux-pty = { path = "crates/mux-pty" }
mux-proto = { path = "crates/mux-proto" }
mux-time = { path = "crates/mux-time" }
mux-termlet = { path = "crates/mux-termlet" }
mux-orm = { path = "crates/mux-orm" }
mux-test-support = { path = "crates/mux-test-support" }
mux-kernel = { path = "crates/mux-kernel" }
mux-render = { path = "crates/mux-render" }
mux-api = { path = "crates/mux-api" }
mux-config = { path = "crates/mux-config" }
mux-term = { path = "crates/mux-term" }
mux-crdt = { path = "crates/mux-crdt" }
mux-fdpass = { path = "crates/mux-fdpass" }
mux-client = { path = "crates/mux-client" }
mux-server = { path = "crates/mux-server" }
mux-input = { path = "crates/mux-input" }
mux-effects = { path = "crates/mux-effects" }

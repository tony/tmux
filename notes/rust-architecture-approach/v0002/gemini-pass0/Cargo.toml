[workspace]
resolver = "2"
members = [
    "crates/mux-api",
    "crates/mux-cmd-parse",
    "crates/mux-ffi",
    "crates/mux-format",
    "crates/mux-grapheme-arena",
    "crates/mux-grid",
    "crates/mux-kernel",
    "crates/mux-options",
    "crates/mux-orm",
    "crates/mux-otel",
    "crates/mux-parser",
    "crates/mux-proto",
    "crates/mux-pty",
    "crates/mux-render",
    "crates/mux-snapshot",
    "crates/mux-target",
    "crates/mux-termlet",
    "crates/mux-test-support",
    "crates/mux-time",
    "crates/mux-types",
    "tools/mux-doctor",
    "tools/tmux-builder",
    "tools/tmux-sniff",
    "tools/tmux-vm",
]

exclude = [
    "bindings/node",
    "bindings/python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["TermForge Contributors"]
license = "MIT"
repository = "https://github.com/termforge/termforge"

[workspace.dependencies]
# Intra-workspace
mux-api = { path = "crates/mux-api" }
mux-cmd-parse = { path = "crates/mux-cmd-parse" }
mux-ffi = { path = "crates/mux-ffi" }
mux-format = { path = "crates/mux-format" }
mux-grapheme-arena = { path = "crates/mux-grapheme-arena" }
mux-grid = { path = "crates/mux-grid" }
mux-kernel = { path = "crates/mux-kernel" }
mux-options = { path = "crates/mux-options" }
mux-orm = { path = "crates/mux-orm" }
mux-otel = { path = "crates/mux-otel" }
mux-parser = { path = "crates/mux-parser" }
mux-proto = { path = "crates/mux-proto" }
mux-pty = { path = "crates/mux-pty" }
mux-render = { path = "crates/mux-render" }
mux-snapshot = { path = "crates/mux-snapshot" }
mux-target = { path = "crates/mux-target" }
mux-termlet = { path = "crates/mux-termlet" }
mux-test-support = { path = "crates/mux-test-support" }
mux-time = { path = "crates/mux-time" }
mux-types = { path = "crates/mux-types" }

# External
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
opentelemetry = "0.22"
tokio = { version = "1.36", features = ["full"] }
bitflags = "2.4"
slotmap = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
nix = { version = "0.28", features = ["fs", "term", "process", "signal", "ioctl"] }
libc = "0.2"
crossbeam-channel = "0.5"
insta = { version = "1.34", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
--- END FILE ---
